services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexireview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexireview_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lexireview}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexireview}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexireview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lexireview_dev_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      # Migrations run against DATABASE_URL (owner role, DDL). The running
      # app must use APP_DATABASE_URL (app_user, RLS-enforced) instead.
      APP_DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/${POSTGRES_DB:-lexireview}
      # Vite dev serves plain http://localhost:5173 -- browsers silently
      # drop Secure cookies over plain HTTP, so local compose dev must opt
      # out explicitly (app/main.py's _set_access_cookie). Set here, not
      # only in .env.example, so it applies without a manual .env edit.
      ENVIRONMENT: development
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/${POSTGRES_DB:-lexireview}
    volumes:
      - ./backend:/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
