name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexireview
          POSTGRES_PASSWORD: lexireview_dev
          POSTGRES_DB: lexireview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexireview"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: lexireview
      POSTGRES_PASSWORD: lexireview_dev
      POSTGRES_DB: lexireview
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://lexireview:lexireview_dev@localhost:5432/lexireview
      # CI-only app_user password for migration 001 (backend/alembic/versions);
      # not a real secret, never used outside the ephemeral CI service container.
      # Distinct from POSTGRES_PASSWORD (the owner/superuser role) above.
      APP_USER_PASSWORD: ci_app_user_password_not_a_real_secret
      # Must be set before "Migrate database" (which creates app_user from
      # APP_USER_PASSWORD) and is inherited by every later step including
      # pytest. Without this, db.py's owner-role fallback silently runs
      # RLS-dependent tests (e.g. storage.py's anti-enumeration test) as the
      # superuser/BYPASSRLS role, bypassing RLS entirely (see DECISION_LOG.md).
      APP_DATABASE_URL: postgresql://app_user:ci_app_user_password_not_a_real_secret@localhost:5432/lexireview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app -ll

      - name: Migrate database (alembic upgrade head)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest -q
